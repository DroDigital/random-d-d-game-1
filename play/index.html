<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Oathguard</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="view"></canvas>
<canvas id="overlay"></canvas>
<div id="ui"></div>
<div id="boot">
  <div class="boot-title">OATHGUARD</div>
  <div class="boot-sub">kindling the embers&hellip;</div>
  <div class="boot-bar"><div id="boot-fill"></div></div>
  <div class="boot-note" id="boot-note">Loading assets (works offline, straight from disk)</div>
</div>
<script src="data/packs.js"></script>
<script>
// Load asset packs one after another (works from file://), then the game.
(function () {
  var packs = (window.__AO_PACKS || []).concat(['game.js']);
  var fill = document.getElementById('boot-fill');
  var i = 0;
  function next() {
    if (i >= packs.length) return;
    var s = document.createElement('script');
    s.src = packs[i];
    s.onload = function () { i++; fill.style.width = (i / packs.length * 100) + '%'; next(); };
    s.onerror = function () { document.getElementById('boot-note').textContent = 'Failed to load ' + packs[i] + ' - run "npm run build" first.'; };
    document.body.appendChild(s);
  }
  next();
})();
</script>
</body>
</html>
