# Builds native desktop packages of Ashen Oath on each OS's own runner:
#   Windows: NSIS installer + portable .exe
#   macOS:   universal (Intel + Apple Silicon) .dmg + .zip (unsigned)
#   Linux:   AppImage + .tar.gz
# Runs on pull requests (packages are downloadable from the run's Artifacts),
# manually from the Actions tab, or on a tag like v1.0.0, which also attaches
# the packages to a GitHub Release.
name: Desktop builds

on:
  workflow_dispatch:
  pull_request:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win -c.win.signAndEditExecutable=true
          - os: macos-latest
            target: --mac
          - os: ubuntu-latest
            target: --linux
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false' # no code signing certificate; builds are unsigned
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx electron-builder ${{ matrix.target }} --publish never
        shell: bash # PowerShell would split '-c.win.…=true' into two arguments
      - uses: actions/upload-artifact@v4
        with:
          name: ashen-oath-${{ runner.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            dist/*.tar.gz
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: packages
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: packages/*
          generate_release_notes: true
